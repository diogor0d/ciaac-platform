name: Publicar versão assinada

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Etiqueta canónica, por exemplo v0.1.0-alpha.1
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Obter código
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Preparar Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Validar versão e construir
        id: build
        env:
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(mvn --batch-mode --no-transfer-progress help:evaluate -Dexpression=project.version -q -DforceStdout)
          [[ "$TAG" == "v$version" ]]
          grep -Fqx "version: '$version'" src/main/resources/plugin.yml
          mvn --batch-mode --no-transfer-progress clean verify
          mkdir release-assets
          cp "target/CIAACPlatform-$version.jar" release-assets/ciaac-platform.jar
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Criar rascunho e obter ID
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          prerelease=false
          [[ "$TAG" == *-* ]] && prerelease=true
          release_id=$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$TAG" \
            -f target_commitish="$GITHUB_SHA" \
            -f name="$TAG" \
            -f body='Versão experimental da CIAACPlatform. Consulta README.md e docs/RELEASES.md antes de utilizar.' \
            -F draft=true \
            -F prerelease="$prerelease" \
            --jq .id)
          [[ "$release_id" =~ ^[1-9][0-9]*$ ]]
          printf 'release_id=%s\n' "$release_id" >> "$GITHUB_OUTPUT"
      - name: Gerar, assinar e verificar manifesto
        env:
          CIAAC_RELEASE_ED25519_PRIVATE_KEY_BASE64: ${{ secrets.CIAAC_RELEASE_ED25519_PRIVATE_KEY_BASE64 }}
          RELEASE_ID: ${{ steps.draft.outputs.release_id }}
          VERSION: ${{ steps.build.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CIAAC_RELEASE_ED25519_PRIVATE_KEY_BASE64"
          chmod +x tools/create-release-manifest tools/sign-release-manifest
          tools/create-release-manifest "$RELEASE_ID" "$VERSION" release-assets/ciaac-platform.jar \
            release-assets/ciaac-platform-update.properties
          printf '%s\n' "$CIAAC_RELEASE_ED25519_PRIVATE_KEY_BASE64" | \
            tools/sign-release-manifest --key-base64-stdin \
              --input release-assets/ciaac-platform-update.properties \
              --output release-assets/ciaac-platform-update.properties.sig
          test "$(wc -c < release-assets/ciaac-platform-update.properties.sig)" -eq 88
          ! grep -q '[[:space:]]' release-assets/ciaac-platform-update.properties.sig
          unset CIAAC_RELEASE_ED25519_PRIVATE_KEY_BASE64
          base64 --decode release-keys/ciaac-platform-ed25519-public.der.b64 > "$RUNNER_TEMP/ciaac-release-public.der"
          base64 --decode release-assets/ciaac-platform-update.properties.sig > "$RUNNER_TEMP/ciaac-release-signature.bin"
          openssl pkeyutl -verify -pubin -keyform DER \
            -inkey "$RUNNER_TEMP/ciaac-release-public.der" -rawin \
            -in release-assets/ciaac-platform-update.properties \
            -sigfile "$RUNNER_TEMP/ciaac-release-signature.bin"
          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -eq 3
      - name: Carregar, publicar e confirmar imutabilidade
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          RELEASE_ID: ${{ steps.draft.outputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$TAG" \
            release-assets/ciaac-platform.jar \
            release-assets/ciaac-platform-update.properties \
            release-assets/ciaac-platform-update.properties.sig

          prerelease=false
          [[ "$TAG" == *-* ]] && prerelease=true
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" | jq -e \
            --arg tag "$TAG" --arg sha "$GITHUB_SHA" --argjson prerelease "$prerelease" '
              .draft == true and
              .tag_name == $tag and
              .target_commitish == $sha and
              .prerelease == $prerelease and
              (.assets | length) == 3 and
              ([.assets[].name] | sort) == ([
                "ciaac-platform-update.properties",
                "ciaac-platform-update.properties.sig",
                "ciaac-platform.jar"
              ] | sort) and
              ([.assets[] | select(.state != "uploaded" or .size <= 0)] | length) == 0
            ' >/dev/null

          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" | jq -er \
            --arg tag "$TAG" '
              select(
                .draft == false and
                .immutable == true and
                .tag_name == $tag and
                (.assets | length) == 3
              ) | .html_url
            '
