name: Verificar código

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Obter código
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Preparar Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Validar ligações da documentação
        run: |
          python3 scripts/check_docs.py --self-test
          python3 scripts/check_docs.py
      - name: Testar e empacotar
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Verificar cliente sintético sem conexão
        run: python3 tools/arena-client-fixture/build.py --maven mvn --self-test
